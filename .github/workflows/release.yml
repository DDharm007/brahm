name: Release Binaries (Zero-Rust Standalone Executables)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: target/x86_64-pc-windows-msvc/release/brahm.exe
            asset: brahm-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: target/x86_64-unknown-linux-gnu/release/brahm
            asset: brahm-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: target/x86_64-apple-darwin/release/brahm
            asset: brahm-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: target/aarch64-apple-darwin/release/brahm
            asset: brahm-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ matrix.bin }}" "release-assets/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum brahm-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
