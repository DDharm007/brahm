[package]
name = "brahm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Dharm Patel <168700406+DDharm007@users.noreply.github.com>"]
description = "Blind Reverse-engineering & Adversarial Honeypot Mechanism — Stage 01 Repository Analyzer"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/DDharm007/brahm"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"
globset = "0.4"
blake3 = "1.5"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
humansize = "2.1"

[dev-dependencies]
tempfile = "3.14"

[[bin]]
name = "brahm"
path = "src/main.rs"

[lib]
name = "brahm"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
